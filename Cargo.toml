[package]
name = "yaasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Yet Another Agent Skills Manager"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync"] }
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"

