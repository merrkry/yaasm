[package]
name = "yaasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Yet Another Agent Skills Manager"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
hex = "0.4.3"
indicatif = "0.18.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
shellexpand = "3.1.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync"] }
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
dunce = "1.0.5"
junction = "2.0.0"
